<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SeatPlan - Students</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
                         HEADER
===================================================== -->

<header>

    <div class="logo">
        SeatPlan
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="halls.html">
            Halls
        </a>

        <a href="students.html">
            Students
        </a>

        <a href="sessions.html">

        </a>

        <a href="seating.html">
            Seating
        </a>

        <a href="search.html">
            Search Student
        </a>

    </nav>

</header>



<!-- =====================================================
                       MAIN CONTENT
===================================================== -->

<main class="page-container">


    <h1>
        Students
    </h1>


    <p class="page-description">

        Add and manage students who will
        attend the examination.

    </p>



    <!-- =================================================
                       ADD STUDENT
    ================================================== -->

    <section class="form-card">


        <h2>
            Add Student
        </h2>


        <div class="form-row">


            <!-- Student Name -->

            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                        type="text"
                        id="name"
                        placeholder="Example: Arun Kumar"
                >

            </div>



            <!-- Register Number -->

            <div class="form-group">

                <label for="registerNumber">
                    Register Number
                </label>

                <input
                        type="text"
                        id="registerNumber"
                        placeholder="Example: 24ECE001"
                >

            </div>



            <!-- Class -->

            <div class="form-group">

                <label for="className">
                    Class
                </label>

                <input
                        type="text"
                        id="className"
                        placeholder="Example: ECE"
                >

            </div>


        </div>



        <div class="form-row">


            <!-- Section -->

            <div class="form-group">

                <label for="section">
                    Section
                </label>

                <input
                        type="text"
                        id="section"
                        placeholder="Example: A"
                >

            </div>


        </div>



        <button
                type="button"
                class="button"
                onclick="addStudent()"
        >

            Add Student

        </button>


    </section>



    <!-- =================================================
                       STUDENT LIST
    ================================================== -->

    <section class="table-card">


        <div class="section-header">

            <h2>
                Student List
            </h2>

        </div>



        <table>


            <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Name
                </th>

                <th>
                    Register Number
                </th>

                <th>
                    Class
                </th>

                <th>
                    Section
                </th>

                <th>
                    Action
                </th>

            </tr>

            </thead>



            <tbody id="studentTableBody">

            <!--
                Student records will be loaded
                here using JavaScript.
            -->

            </tbody>


        </table>


    </section>


</main>



<!-- =====================================================
                         FOOTER
===================================================== -->

        SeatPlan © 2026
