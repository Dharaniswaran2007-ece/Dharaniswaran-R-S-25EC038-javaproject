<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SeatPlan - Seating Arrangement</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        SeatPlan
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="halls.html">Halls</a>
        <a href="students.html">Students</a>
        <a href="sessions.html">Exam Sessions</a>
        <a href="seating.html">Seating</a>
        <a href="search.html">Search Student</a>
    </nav>

</header>


<main class="page-container">

    <h1>Seating Arrangement</h1>

    <p class="page-description">
        Select an examination hall and exam session
        to generate the seating plan.
    </p>


    <!-- Generate Seating Form -->

    <section class="form-card">

        <h2>Generate Seating Plan</h2>

        <div class="form-row">

            <div class="form-group">

                <label for="hallSelect">
                    Select Hall
                </label>

                <select id="hallSelect">

                    <option value="">
                        Select Hall
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="sessionSelect">
                    Select Exam Session
                </label>

                <select id="sessionSelect">

                    <option value="">
                        Select Exam Session
                    </option>

                </select>

            </div>

        </div>


        <button
                type="button"
                class="button"
                onclick="generateSeating()">

            Generate Seating Plan

        </button>

    </section>


    <!-- Seating Plan -->

    <section
            class="table-card"
            id="seatingSection"
            style="display: none;">

        <div class="section-header">

            <h2 id="planTitle">
                Seating Plan
            </h2>

        </div>


        <div
                id="seatingGrid"
                class="seating-grid">

        </div>

    </section>

</main>


<footer>

    <p>
        SeatPlan © 2026
    </p>

</footer>


<!-- ONLY ONE JAVASCRIPT FILE -->

<script src="js/app.js"></script>

</body>

</html>
