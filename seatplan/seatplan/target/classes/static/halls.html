    <meta charset="UTF-8">

            content="width=device-width, initial-scale=1.0"
    >

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
                         HEADER
===================================================== -->

<header>

    <div class="logo">
        SeatPlan
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="halls.html">
            Halls
        </a>

        <a href="students.html">

        <a href="seating.html">
            Seating
        </a>

        <a href="search.html">
            Search Student
        </a>

    </nav>

</header>



<!-- =====================================================
                       MAIN CONTENT
===================================================== -->

<main class="page-container">


    <h1>
        Examination Halls
    </h1>


    <p class="page-description">

        Add and manage examination halls
        and their seating capacity.

    </p>



    <!-- =================================================
                         ADD HALL
    ================================================== -->

    <section class="form-card">


        <h2>
            Add Examination Hall
        </h2>


        <div class="form-row">


            <!-- Hall Name -->

            <div class="form-group">

                <label for="hallName">
                    Hall Name
                </label>

                <input
                        type="text"
                        id="hallName"
                        placeholder="Example: Main Hall"
                >

            </div>



            <!-- Row Count -->

            <div class="form-group">

                <label for="rowCount">
                    Number of Rows
                </label>

                <input
                        type="number"
                        id="rowCount"
                        placeholder="Example: 5"
                        min="1"
                >

            </div>



            <!-- Column Count -->

            <div class="form-group">

                <label for="columnCount">
                    Number of Columns
                </label>

                <input
                        type="number"
                        id="columnCount"
                        placeholder="Example: 6"
                        min="1"
                >

            </div>


        </div>



        <div class="form-row">


            <!-- Capacity -->

            <div class="form-group">

                <label for="capacity">
                    Hall Capacity
                </label>

                <input
                        type="number"
                        id="capacity"
                        placeholder="Example: 30"
                        min="1"
                >

            </div>


        </div>



        <button
                type="button"
                class="button"
                onclick="addHall()"
        >

            Add Hall

        </button>


    </section>



    <!-- =================================================
                      HALL LIST
    ================================================== -->

    <section class="table-card">


        <div class="section-header">

            <h2>
                Hall List
            </h2>

        </div>



        <table>


            <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Hall Name
                </th>

                <th>
                    Rows
                </th>

                <th>
                    Columns
                </th>

                <th>
                    Capacity
                </th>

                <th>
                    Action
                </th>

            </tr>

            </thead>



            <tbody id="hallTableBody">

            <!--
                Hall records will be loaded
                here using JavaScript.
            -->

            </tbody>


        </table>


    </section>


</main>

                         FOOTER
===================================================== -->
